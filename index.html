<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラブカ ライブフェイズ補助</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f5f7;
  color: #222;
}

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 10px 0 24px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 12px;
  background: white;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 14px;
}

.hearts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.heart-box {
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  background: #f1f1f1;
}

.heart-icon {
  font-size: 27px;
  line-height: 1.2;
}

.heart-name {
  font-size: 12px;
  margin-top: 4px;
}

.heart-number {
  font-size: 22px;
  font-weight: 800;
  margin-top: 3px;
}

.pink { background: #ffe1ee; }
.green { background: #dff5df; }
.blue { background: #dceeff; }
.red { background: #ffe0e0; }
.yellow { background: #fff4c7; }
.purple { background: #eadfff; }
.gray { background: #e5e5e5; }

.total {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  margin: 8px 0;
}

.status {
  text-align: center;
  padding: 15px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 800;
  margin-top: 14px;
}

.success {
  background: #dff5df;
  color: #18752a;
}

.fail {
  background: #ffe0e0;
  color: #c62828;
}

.small {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎤 ラブカ<br>ライブフェイズ補助</h1>

<div class="card">

  <label for="liveSelect">ライブカードを選択</label>

  <select id="liveSelect" onchange="selectLive()">
    <option value="">選択してください</option>
    <option value="burn">Burn!!</option>
    <option value="dive">DIVE!</option>
    <option value="chase">CHASE!</option>
  </select>

</div>


<div class="card">

  <div class="section-title">
    ライブ成功に必要なハート
  </div>

  <div class="hearts">

    <div class="heart-box pink">
      <div class="heart-icon">🩷</div>
      <div class="heart-name">ピンク</div>
      <div class="heart-number" id="need-pink">0</div>
    </div>

    <div class="heart-box green">
      <div class="heart-icon">💚</div>
      <div class="heart-name">緑</div>
      <div class="heart-number" id="need-green">0</div>
    </div>

    <div class="heart-box blue">
      <div class="heart-icon">💙</div>
      <div class="heart-name">青</div>
      <div class="heart-number" id="need-blue">0</div>
    </div>

    <div class="heart-box red">
      <div class="heart-icon">❤️</div>
      <div class="heart-name">赤</div>
      <div class="heart-number" id="need-red">0</div>
    </div>

    <div class="heart-box yellow">
      <div class="heart-icon">💛</div>
      <div class="heart-name">黄</div>
      <div class="heart-number" id="need-yellow">0</div>
    </div>

    <div class="heart-box purple">
      <div class="heart-icon">💜</div>
      <div class="heart-name">紫</div>
      <div class="heart-number" id="need-purple">0</div>
    </div>

    <div class="heart-box gray">
      <div class="heart-icon">🩶</div>
      <div class="heart-name">任意</div>
      <div class="heart-number" id="need-gray">0</div>
    </div>

  </div>

</div>


<div class="card">

  <div class="section-title">
    必要ライブハート数
  </div>

  <div class="total" id="need-total">0</div>

  <div class="small">
    カードを選択すると自動計算されます
  </div>

</div>


<div class="card">

  <div class="section-title">
    現在のハート
  </div>

  <div class="hearts">

    <div class="heart-box pink">
      <div class="heart-icon">🩷</div>
      <div class="heart-number">
        <input id="have-pink" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

    <div class="heart-box green">
      <div class="heart-icon">💚</div>
      <div class="heart-number">
        <input id="have-green" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

    <div class="heart-box blue">
      <div class="heart-icon">💙</div>
      <div class="heart-number">
        <input id="have-blue" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

    <div class="heart-box red">
      <div class="heart-icon">❤️</div>
      <div class="heart-number">
        <input id="have-red" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

    <div class="heart-box yellow">
      <div class="heart-icon">💛</div>
      <div class="heart-number">
        <input id="have-yellow" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

    <div class="heart-box purple">
      <div class="heart-icon">💜</div>
      <div class="heart-number">
        <input id="have-purple" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

    <div class="heart-box gray">
      <div class="heart-icon">🩶</div>
      <div class="heart-number">
        <input id="have-gray" type="number" min="0" value="0"
        style="width:60px;text-align:center;font-size:20px;">
      </div>
    </div>

  </div>

</div>


<div class="card">

  <div class="section-title">
    結果
  </div>

  <div class="total" id="have-total">
    0
  </div>

  <div id="status" class="status fail">
    ライブカードを選択してください
  </div>

</div>

</div>


<script>

const lives = {

  burn: {
    name: "Burn!!",
    pink: 0,
    green: 0,
    blue: 0,
    red: 7,
    yellow: 0,
    purple: 0,
    gray: 7
  },

  dive: {
    name: "DIVE!",
    pink: 0,
    green: 0,
    blue: 3,
    red: 4,
    yellow: 0,
    purple: 0,
    gray: 5
  },

  chase: {
    name: "CHASE!",
    pink: 0,
    green: 0,
    blue: 1,
    red: 2,
    yellow: 0,
    purple: 0,
    gray: 0
  }

};


function selectLive() {

  const key = document.getElementById("liveSelect").value;

  if (!key) {
    clearNeed();
    updateResult();
    return;
  }

  const live = lives[key];

  const colors = [
    "pink",
    "green",
    "blue",
    "red",
    "yellow",
    "purple",
    "gray"
  ];

  let total = 0;

  colors.forEach(color => {

    const value = live[color] || 0;

    document.getElementById("need-" + color).textContent = value;

    total += value;

  });

  document.getElementById("need-total").textContent = total;

  updateResult();

}


function clearNeed() {

  const colors = [
    "pink",
    "green",
    "blue",
    "red",
    "yellow",
    "purple",
    "gray"
  ];

  colors.forEach(color => {
    document.getElementById("need-" + color).textContent = "0";
  });

  document.getElementById("need-total").textContent = "0";

}


function updateResult() {

  const need =
    Number(document.getElementById("need-total").textContent) || 0;

  const colors = [
    "pink",
    "green",
    "blue",
    "red",
    "yellow",
    "purple",
    "gray"
  ];

  let have = 0;

  colors.forEach(color => {

    have += Number(
      document.getElementById("have-" + color).value
    ) || 0;

  });

  document.getElementById("have-total").textContent = have;

  const status = document.getElementById("status");

  if (!document.getElementById("liveSelect").value) {

    status.textContent = "ライブカードを選択してください";
    status.className = "status fail";

  } else if (have >= need) {

    status.textContent = "✓ ライブ成功";
    status.className = "status success";

  } else {

    status.textContent =
      "あと " + (need - have) + " ハート";

    status.className = "status fail";

  }

}


document.querySelectorAll('input[type="number"]').forEach(input => {

  input.addEventListener("input", updateResult);

});

</script>

</body>
</html>
